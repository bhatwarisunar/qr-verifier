<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Verifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.0.10"></script>
  <style>
    body { text-align:center; font-family:Arial; background:#f5f7fa; }
    video { width:100%; max-width:380px; border-radius:12px; }
    .status { margin-top:10px; font-weight:bold; }
  </style>
</head>
<body>

<h2>QR Verifier</h2>
<video id="video" autoplay playsinline></video>
<div class="status" id="status">Scanning…</div>

<script>
const statusEl = document.getElementById("status");
const video = document.getElementById("video");

// Prefer native BarcodeDetector if available
if ("BarcodeDetector" in window) {
  const detector = new BarcodeDetector({ formats: ["qr_code"] });

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  }).then(stream => {
    video.srcObject = stream;

    const scan = async () => {
      try {
        const barcodes = await detector.detect(video);
        if (barcodes.length) {
          window.location.href = barcodes[0].rawValue;
          return;
        }
      } catch {}
      requestAnimationFrame(scan);
    };
    scan();
  });
} else {
  // ZXing fallback
  const reader = new ZXing.BrowserQRCodeReader();
  reader.decodeFromVideoDevice(null, video, (result, err) => {
    if (result) {
      window.location.href = result.text;
    }
  });
}
</script>

</body>
</html>
