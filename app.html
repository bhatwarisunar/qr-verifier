<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Verifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Stable QR library -->
  <script src="https://unpkg.com/html5-qrcode@2.2.1"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      margin: 0;
      padding: 10px;
    }
    h2 {
      margin-top: 10px;
    }
    #reader {
      width: 100%;
      max-width: 360px;
      margin: auto;
    }
    .hint {
      color: #444;
      font-size: 14px;
      margin-top: 10px;
    }
    .status {
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>QR Verifier</h2>

<div id="reader"></div>

<div class="hint">
  Hold phone steady • Keep QR inside box
</div>

<div class="status" id="status"></div>

<script>
  const statusEl = document.getElementById("status");

  function onScanSuccess(decodedText) {
    statusEl.innerText = "Checking…";
    // decodedText already contains redirect URL
    window.location.href = decodedText;
  }

  function onScanFailure(error) {
    // ignore scan failures for performance
  }

  // IMPORTANT: simple, stable start
  Html5Qrcode.getCameras().then(cameras => {
    if (!cameras || cameras.length === 0) {
      statusEl.innerText = "No camera found";
      return;
    }

    const cameraId = cameras[cameras.length - 1].id; // rear camera

    const qr = new Html5Qrcode("reader");

    qr.start(
      cameraId,
      {
        fps: 15,
        qrbox: 280,
        disableFlip: true
      },
      onScanSuccess,
      onScanFailure
    );
  }).catch(err => {
    statusEl.innerText = "Camera error: " + err;
  });
</script>

</body>
</html>
